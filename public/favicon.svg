<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#060812;stop-opacity:1" />
    </radialGradient>
  </defs>
  <circle cx="50%" cy="50%" r="48" fill="#060812" stroke="#22c55e" stroke-width="2"/>
  <circle cx="50%" cy="50%" r="25" fill="url(#eyeGlow)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="50%" cy="50%" r="12" fill="#000" stroke="#22c55e" stroke-width="1"/>
  <circle cx="45%" cy="45%" r="3" fill="#fff" opacity="0.5" />
</svg>
